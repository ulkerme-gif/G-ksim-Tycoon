<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1720">
<title>Havalimanı Tycoon</title>
<style>/*__CSS__*/</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">Havalimanı hazırlanıyor…</div>

<header id="top">
  <button id="menu-btn" title="Menü" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand">Havalimanı<b>Tycoon</b></div>
  <div class="stat money"><span id="money">₺0</span><small id="net"></small></div>
  <div class="stat time"><span id="clock">06:00</span><small id="day">1. gün</small></div>
  <div id="speed" role="group" aria-label="Hız">
    <button data-speed="0" title="Duraklat (Boşluk)"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button>
  </div>
  <div class="stat rate"><span id="stars"></span><small id="wind"></small></div>
  <button id="lvl" title="Seviye ve sıralama (Hedefler)">
    <span class="lv-n" id="lvl-n">1</span>
    <span class="lv-t"><b id="lvl-name">Yerel Havaalanı</b><span class="lbar"><i id="lvl-bar"></i></span></span>
    <span class="lv-r" id="rank">#13</span>
  </button>
  <div id="wx" hidden></div>
  <div class="stat nextf"><small id="next"></small></div>
</header>

<nav id="tools" aria-label="İnşaat araçları"></nav>
<div id="opts" hidden></div>
<div id="tip" hidden></div>
<div id="confirm" hidden>
  <button class="btn" id="confirm-rot">Döndür</button>
  <button class="btn" id="confirm-cancel">İptal</button>
  <button class="btn primary" id="confirm-ok">Kur</button>
</div>

<nav id="tabs" aria-label="Paneller">
  <button data-panel="flights"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg><span>Uçuşlar</span></button>
  <button data-panel="airlines"><svg viewBox="0 0 24 24"><path d="M12 3v18M4 12l8-3 8 3M8 20l4-1.5 4 1.5"/></svg><span>Havayolları</span></button>
  <button data-panel="finance"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Finans</span></button>
  <button data-panel="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg><span>Hedefler</span></button>
  <button data-panel="upgrades"><svg viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6M5 20h14"/></svg><span>Yükseltme</span></button>
  <button data-panel="guide"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg><span>Rehber</span></button>
</nav>
<aside id="panel" hidden>
  <div class="ph"><h2 id="panel-title"></h2><button id="panel-close" aria-label="Kapat">✕</button></div>
  <div id="panel-body"></div>
</aside>

<div id="zoomctl" role="group" aria-label="Yakınlaştırma">
  <button data-z="in" title="Yakınlaştır (+)" aria-label="Yakınlaştır"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-z="out" title="Uzaklaştır (−)" aria-label="Uzaklaştır"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button data-z="north" title="Kuzeye döndür" aria-label="Kuzeye döndür"><svg id="compass" viewBox="0 0 24 24"><path d="M12 3l4 9h-8z" fill="#ff6b6b" stroke="#ff6b6b"/><path d="M12 21l-4-9h8z"/></svg></button>
</div>
<input type="file" id="file-in" accept=".json,application/json,text/plain" hidden>
<div id="sel" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div id="modal-card"></div></div>
<script>/*__JS__*/</script>
</body>
</html>
